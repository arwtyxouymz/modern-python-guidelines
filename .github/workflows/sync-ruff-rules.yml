name: Sync Ruff rule snapshot

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Regenerate from latest Ruff
        run: python scripts/sync_rules.py
      - name: Validate generated distribution
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_distribution.py
      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-ruff-rules
          delete-branch: true
          commit-message: "chore: update Ruff rule snapshot"
          title: "chore: update Ruff rule snapshot"
          body: |
            Automated update from the latest stable Ruff rule catalog.

            Review newly added, removed, deprecated, and fix-safety metadata before merging.
          labels: dependencies
