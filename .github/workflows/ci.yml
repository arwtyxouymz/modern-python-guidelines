name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Real Ruff integration smoke test
        run: |
          requirement_file="plugins/modern-python-guidelines/skills/use-modern-python/scripts/ruff-fallback.txt"
          ruff_requirement="$(tr -d '\n' < "$requirement_file")"
          export MODERN_PYTHON_RUFF_COMMAND="uvx --from $ruff_requirement ruff"
          python scripts/smoke_test.py
      - name: Validate distribution
        run: python scripts/validate_distribution.py
      - name: Ruff check
        run: |
          RUFF_REQUIREMENT=$(tr -d '\n' < plugins/modern-python-guidelines/skills/use-modern-python/scripts/ruff-fallback.txt)
          uvx --from "$RUFF_REQUIREMENT" ruff check .
      - name: Ruff format
        run: |
          RUFF_REQUIREMENT=$(tr -d '\n' < plugins/modern-python-guidelines/skills/use-modern-python/scripts/ruff-fallback.txt)
          uvx --from "$RUFF_REQUIREMENT" ruff format --check .
