[project]
name = "modern-python-guidelines"
version = "0.2.0"
description = "Ruff-backed modern Python guidance for AI coding agents"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
